name: github-pr-jev-review
description: Run a Jev-only quality scorecard for a GitHub pull request
metadata:
  kind: review
  tags: [review, github, pull-request, jev]
  review:
    source: github-pr
    diff: true
    issues: false
inputs:
  owner:
    type: string
    required: true
    description: GitHub repository owner
  repo:
    type: string
    required: true
    description: GitHub repository name
  pr:
    type: number
    required: true
    description: Pull request number
  post:
    type: boolean
    default: false
    description: Post a summary scorecard to the PR
  requireCompleteDiff:
    type: boolean
    default: true
    description: Fail when GitHub cannot provide a stable, complete file and patch snapshot
output: review
nodes:
  change:
    action: change-source
    with:
      type: github-pr
      owner: '{{inputs.owner}}'
      repo: '{{inputs.repo}}'
      pr: '{{inputs.pr}}'
      requireCompleteDiff: '{{inputs.requireCompleteDiff}}'
    output: change

  review:
    action: review
    needs:
      - change
    with:
      source: change
      mode: jev
    output: review

  post-comments:
    action: post-review-comments
    needs:
      - review
    if: inputs.post == true
    with:
      source: change
      review: review
    output: postedReview
