agents:
  default:
    model: opencode-go/glm-5.1
    skills:
      - cli-testing
  namespaces:
    review:
      model: opencode-go/glm-5.2
    visual:
      model: opencode-go/kimi-k2.7-code
    task:
      model: opencode-go/kimi-k2.7-code

workflow:
  default: local-changelog-review

review:
  agent: review/unified-reviewer
  ignorePatterns:
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"

describe:
  model: opencode-go/kimi-k2.7-code
  includeProjectContext: true

contextCompression:
  enabled: true
  thresholdPercent: 0.15
  maxTokens: 32000
  softBufferTokens: 1500
  hardBufferTokens: 1000
  tokenEstimateDivisor: 4

fix:
  checks:
    - name: typecheck
      command: npm run type-check
      matchPaths:
        - "src/**/*.ts"
      timeoutMs: 60000
    - name: lint
      command: npm run lint
      matchPaths:
        - "src/**/*.ts"
      timeoutMs: 60000
    - name: tests
      command: npm test
      matchPaths:
        - "src/**/*.ts"
      timeoutMs: 120000
